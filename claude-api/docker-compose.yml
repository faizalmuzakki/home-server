services:
  claude-api:
    build: .
    container_name: claude-api
    user: "1000:1000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:nosuid,size=100m
    environment:
      - TZ=Asia/Jakarta
      - PORT=3100
      - API_SECRET=${API_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5}
      - MAX_TURNS=${MAX_TURNS:-10}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-3}
      - NODE_OPTIONS=--max-old-space-size=256
      - HOME=/home/claude
      # Free Gemini fallback via host-mounted Antigravity (agy) CLI when the
      # Claude Code CLI hits weekly or session usage limits (429) or auth fails.
      - AGY_BIN=/host-local-bin/agy
      - FALLBACK_MODEL=${FALLBACK_MODEL:-gemini-3.8-flash}
      - DEFAULT_EFFORT=${DEFAULT_EFFORT:-high}
    volumes:
      - workspace:/workspace:rw
      # rw (running as 1000:1000) so the CLI can write refreshed OAuth tokens
      # back to .credentials.json instead of 401-looping once the 8h access
      # token expires.
      - /home/solork/.claude:/home/claude/.claude:rw
      # Claude Code CLI stores OAuth account metadata + migration state in
      # $HOME/.claude.json (separate from .claude/.credentials.json).
      - /home/solork/.claude.json:/home/claude/.claude.json:rw
      # Host ~/.local/bin mounted ro to access `agy` without single-file inode
      # pinning issues when agy auto-updates on the host.
      - /home/solork/.local/bin:/host-local-bin:ro
      # Antigravity CLI state and OAuth credentials.
      - /home/solork/.gemini/antigravity-cli:/home/claude/.gemini/antigravity-cli:rw
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  workspace:

networks:
  traefik-public:
    external: true
