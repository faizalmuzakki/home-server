services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3002:3001"  # Localhost only
    # healthcheck: the 2.x image ships its own (extra/healthcheck); 2.x has no wget
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=cloudflare"
      - "traefik.http.routers.uptime.middlewares=admin-secure@file"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

# Data is stored in ./data

networks:
  traefik-public:
    external: true
